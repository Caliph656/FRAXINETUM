name: Build FRAXINETUM APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source bundle
        run: |
          python3 - <<'PY'
          import os, re
          t = open("FRAXINETUM_SOURCE.txt", encoding="utf-8").read()
          parts = re.split(r"^#### FILE: (.+?) ####\n", t, flags=re.M)
          for i in range(1, len(parts), 2):
              p = parts[i].strip()
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              open(p, "w", encoding="utf-8").write(parts[i + 1])
          print("unpacked", (len(parts) - 1) // 2, "files")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: bash scripts/android-setup.sh
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FRAXINETUM-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FRAXINETUM.apk
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest FRAXINETUM.apk --repo "$GITHUB_REPOSITORY" --title "FRAXINETUM" --notes "Debug APK"
